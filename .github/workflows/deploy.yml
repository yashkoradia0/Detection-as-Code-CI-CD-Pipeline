name: Deploy The Security Guards

on: 
  push:
    branches: [ main ]

jobs:
  deliver-the-guards:
    runs-on: ubuntu-latest
    env:
      RUNREVEAL_TOKEN: ${{ secrets.RUNREVEAL_API_KEY }}
      RUNREVEAL_WORKSPACE: ${{ secrets.RUNREVEAL_WORKSPACE }}
      
    steps:
      - name: Grab the approved files
        uses: actions/checkout@v3

      - name: Download the RunReveal tool
        run: |
          curl -L https://github.com/runreveal/homebrew-runreveal/releases/latest/download/runreveal-linux-amd64.tar.gz > runreveal.tar.gz
          tar -xvf runreveal.tar.gz
          chmod +x runreveal

      - name: Send the guards to the real city (Sync)
        run: ./runreveal detections sync -d sigma/
