title: Suspicious Password Dumping Command
id: 12345abc-6789-def0-1234-56789abcdef0
status: experimental
description: Detects someone typing a command that is often used to steal passwords from the computer's memory.
author: Yash Koradia
date: 2026/08/24
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'procdump -ma lsass.exe'
  condition: selection
falsepositives:
  - Security engineers testing the system
level: high
